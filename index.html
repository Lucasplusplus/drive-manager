<!DOCTYPE html>
<html>

<head> <!--this holds info about page-->
  <title>Drive Manager</title>
</head>

<body> <!--holds everything actually seen-->

  <h1>Create a Drive</h1>

  <label>Drive name</label>

  <input type="text" id="driveName">

  <label>Start date</label>
  <input type="date" id="startDate"> <!--date picker-->

  <label>End date</label>
  <input type="date" id="endDate">

  <label>Partner type</label>
  <select id="partnerType"> <!--select is a drop down w/ each option inside-->
    <option value="nonprofit">Nonprofit</option>
    <option value="individual">Individual</option>
  </select>

  <button id="createBtn">Create Drive</button>
  <h2>Drives</h2>
  <div id="driveList"></div>
  <h2>Add a Location</h2>
  <label>Location name</label>
  <input type="text" id="locName">
  <label>Contact</label>
  <input type="text" id="locContact">
  <script>
    function saveDrives() {
      localStorage.setItem("driveManagerData", JSON.stringify(drives));
    }

    function loadDrives() {
      const stored = localStorage.getItem("driveManagerData");
      if (stored === null) {
        return [];
      }
      try {
        return JSON.parse(stored);
      } catch (e) {
        return [];
      }
    }

    const drives = loadDrives();

    document.getElementById("createBtn").addEventListener("click", function () {
      const name = document.getElementById("driveName").value;
      const start = document.getElementById("startDate").value;
      const end = document.getElementById("endDate").value;
      const partner = document.getElementById("partnerType").value;

      const drive = {
        id: Date.now(),
        name: name,
        start: start,
        end: end,
        partner: partner,
        locations: []
      };

      drives.push(drive);
      saveDrives();
      renderDrives();
    });

    document.getElementById("driveList").addEventListener("click", function (event) {
      if (event.target.tagName !== "BUTTON") {
        return;
      }

      const action = event.target.dataset.action;

      if (action === "addloc") {
        const drive = drives.find(d => d.id === Number(event.target.dataset.id));
        const locName = document.getElementById("locName").value;
        const locContact = document.getElementById("locContact").value;

        if (locName === "" || locContact === "") {
          return;
        }

        const location = {
          id: Date.now(),
          name: locName,
          contact: locContact,
          status: "pending",
          pickups: []
        };

        drive.locations.push(location);
        document.getElementById("locName").value = "";
        document.getElementById("locContact").value = "";
        saveDrives();
        renderDrives();
      }

      if (action === "confirm") {
        const drive = drives.find(d => d.id === Number(event.target.dataset.drive));
        const location = drive.locations.find(l => l.id === Number(event.target.dataset.loc));
        location.status = "confirmed";
        saveDrives();
        renderDrives();
      }
      if (action === "pickedup") {
        const drive = drives.find(d => d.id === Number(event.target.dataset.drive));
        const location = drive.locations.find(l => l.id === Number(event.target.dataset.loc));
        location.lastPickup = new Date().toISOString().slice(0, 10);
        saveDrives();
        renderDrives();
      }

      if (action === "deldrive") {
        const drive = drives.find(d => d.id === Number(event.target.dataset.id));
        if (!confirm("Delete drive \"" + drive.name + "\"? Its locations will be deleted too.")) {
          return;
        }
        const index = drives.findIndex(d => d.id === Number(event.target.dataset.id));
        drives.splice(index, 1);
        saveDrives();
        renderDrives();
      }

      if (action === "delloc") {
        const drive = drives.find(d => d.id === Number(event.target.dataset.drive));
        if (!confirm("Delete this location?")) {
          return;
        }
        const index = drive.locations.findIndex(l => l.id === Number(event.target.dataset.loc));
        drive.locations.splice(index, 1);
        saveDrives();
        renderDrives();
      }

      if (action === "editcontact") {
        const drive = drives.find(d => d.id === Number(event.target.dataset.drive));
        const location = drive.locations.find(l => l.id === Number(event.target.dataset.loc));
        const newContact = prompt("New contact:", location.contact);
        if (newContact === null || newContact === "") {
          return;
        }
        location.contact = newContact;
        saveDrives();
        renderDrives();
      }
    });

    function isActive(drive) {
      const today = new Date().toISOString().slice(0, 10);
      return drive.start <= today && today <= drive.end;
    }

    function renderDrives() {
      const list = document.getElementById("driveList");
      list.innerHTML = "";
      for (const drive of drives) {
        const active = isActive(drive);
        list.innerHTML += "<p>" + drive.name + " (" + drive.start + " to " + drive.end + ") - " + drive.partner +
          " - " + (active ? "active" : "not active") +
          " <button data-action='addloc' data-id='" + drive.id + "'>Add Location</button>" +
          " <button data-action='deldrive' data-id='" + drive.id + "'>Delete Drive</button></p>";

        for (const location of drive.locations) {
          // adds a paragraph for each location, with a button to confirm the pickup
          list.innerHTML += "<p>&nbsp;&nbsp;&nbsp;&nbsp;" + location.name + " - " + location.contact + " (" + location.status + ")" +
            (location.lastPickup ? " - last pickup: " + location.lastPickup : "") +
            " <button data-action='confirm' data-drive='" + drive.id + "' data-loc='" + location.id + "'>Confirm</button>" +
            (active ? " <button data-action='pickedup' data-drive='" + drive.id + "' data-loc='" + location.id + "'>Picked Up</button>" : "") +
            " <button data-action='delloc' data-drive='" + drive.id + "' data-loc='" + location.id + "'>Delete</button>" +
            " <button data-action='editcontact' data-drive='" + drive.id + "' data-loc='" + location.id + "'>Edit Contact</button>" +
            "</p>";
        }
      }
    }

    renderDrives();
  </script>
</body>

</html>
